name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same Python as AWS Glue 5.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate CloudFormation / SAM template
        run: cfn-lint infrastructure/template.yaml

      - name: Tests
        run: pytest

      - name: Offline pipeline run
        run: python scripts/run_local.py
